<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8ff" id="themeColorMeta">
  <meta name="description" content="Idea Radar — a personal intelligence system for discovering and ranking opportunities.">
  <meta property="og:title" content="Idea Radar">
  <meta property="og:description" content="A Vectorheart signal instrument for startup opportunities.">
  <meta property="og:type" content="website">
  <title>Idea Radar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111111'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23F7F6F3' font-family='monospace' font-size='24' font-weight='600'%3EIR%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Chivo+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-system.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/motion.css">
  <link rel="stylesheet" href="/static/css/vectorheart.css">
  <style>
    :root {
      --font-ui: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'Chivo Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to content</a>

  <div id="app">
    <header class="top-bar">
      <div class="top-bar-row">
        <button class="app-mark" id="appMark" type="button" aria-label="Go to Field">IR/SIGNAL</button>
        <button class="profile-chip" id="profileChip" type="button" aria-haspopup="dialog" aria-controls="settingsSheet" aria-label="Open settings">
          IR
        </button>
      </div>
      <div class="scroll-progress" aria-hidden="true">
        <div class="scroll-progress-fill" id="scrollProgressFill"></div>
      </div>
    </header>

    <main class="main-shell" id="mainContent" tabindex="-1">
      <section class="view is-active" id="viewRadar" data-view="radar" aria-label="Field"></section>
      <section class="view" id="viewMovers" data-view="movers" aria-label="Movers"></section>
      <section class="view" id="viewExplore" data-view="explore" aria-label="Build queue"></section>
      <section class="view" id="viewSystem" data-view="system" aria-label="Archive and system"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item is-active" type="button" data-nav="radar" aria-label="Field">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="1"/>
          <line x1="12" y1="3" x2="12" y2="1"/>
        </svg>
        <span class="nav-label">Field</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" type="button" data-nav="movers" aria-label="Movers">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 8 13 11 16 14 13 20 7"/>
          <polyline points="15 7 20 7 20 12"/>
        </svg>
        <span class="nav-label">Movers</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" type="button" data-nav="explore" aria-label="Build">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
        <span class="nav-label">Build</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" type="button" data-nav="system" aria-label="Archive">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v4m0 14v4M4.22 4.22l2.83 2.83m9.9 9.9 2.83 2.83M1 12h4m14 0h4M4.22 19.78l2.83-2.83m9.9-9.9 2.83-2.83"/>
        </svg>
        <span class="nav-label">Archive</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
    </nav>

    <div class="scrim" id="globalScrim" hidden></div>

    <aside class="inspect-panel" id="inspectPanel" aria-hidden="true" aria-label="Inspect opportunity">
      <div class="inspect-handle" aria-hidden="true"></div>
      <div class="inspect-inner" id="inspectInner"></div>
    </aside>

    <section class="sheet" id="settingsSheet" aria-hidden="true" aria-label="Settings"></section>
    <section class="sheet" id="sortSheet" aria-hidden="true" aria-label="Sort options"></section>
    <section class="sheet sheet-search" id="searchSheet" aria-hidden="true" aria-label="Search opportunities"></section>

    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="/static/js/state.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/motion.js"></script>
  <script src="/static/js/components.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
